name: Build resize2fs static aarch64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu make gettext

      - name: Clone e2fsprogs (GitHub mirror)
        run: git clone --depth 1 --branch v1.47.2 https://github.com/tytso/e2fsprogs.git

      - name: Build static resize2fs
        run: |
          cd e2fsprogs
          mkdir -p build && cd build
          ../configure --host=aarch64-linux-gnu CC=aarch64-linux-gnu-gcc --disable-nls --disable-debugfs --disable-tune2fs --disable-e2image
          make -j$(nproc) all LDFLAGS="-static -s" >&2
          file resize/resize2fs e2fsck/e2fsck
          mkdir -p ../out
          cp -f resize/resize2fs ../out/resize2fs
          cp -f e2fsck/e2fsck ../out/e2fsck

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: resize2fs-aarch64
          path: e2fsprogs/out/
          if-no-files-found: error
